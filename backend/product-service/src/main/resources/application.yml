springdoc:
  paths-to-match: /api/**   # document only our real API, not /hello or /pricing
  default-produces-media-type: application/json   # without this the spec says "*/*" and generated clients read responses as a Blob
  swagger-ui:
    path: /swagger-ui.html    # open http://localhost:8081/swagger-ui.html

logging:
  level:
    com.shopverse: DEBUG    # our own code: show debug logs too

server:
  port: 8081

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://localhost:3307/product_db
    username: shop
    password: ${DB_PASSWORD:shop}
  flyway:
    clean-disabled: true
  jpa:
    open-in-view: false        # no lazy loading after the service method ends
    hibernate:
      ddl-auto: validate       # Flyway creates tables; Hibernate only checks they match
    show-sql: true             # print every SQL statement (learning only)
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
  data:
    web:
      pageable:
        max-page-size: 100     # nobody can ask for 1,000,000 rows

management:
  endpoints:
    web:
      exposure:
        include: health,info,beans,env,mappings   # extra endpoints for learning only
  endpoint:
    health:
      show-details: always

shop:
  currency: INR
  active-pricing-rule: none
