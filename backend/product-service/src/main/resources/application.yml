server:
  port: 8081

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://localhost:3307/product_db
    username: shop
    password: ${DB_PASSWORD:shop}
  flyway:
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,beans,env,mappings   # extra endpoints for learning only
  endpoint:
    health:
      show-details: always

shop:
  currency: INR
  active-pricing-rule: none
